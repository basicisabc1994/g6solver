# Builds the bundle executables on Windows, macOS and Linux. On a version tag (v*) they are
# attached to a new draft GitHub Release. Publication is a separate owner action.
name: bundles
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release tag against stable source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/check_release.py "$GITHUB_REF_NAME"
      - run: python -m pip install . "pyinstaller==6.16.0"
      - if: runner.os == 'Linux'
        run: bash tools/ci_bubblewrap.sh
      - run: python packaging/build_bundles.py
      - name: Smoke-test every executable offline
        shell: python
        run: |
          import pathlib, subprocess, sys
          for exe in sorted(pathlib.Path("dist").iterdir()):
              bundle_id = exe.stem.removeprefix("g6-").rsplit("-", 2)[0]
              subprocess.run([sys.executable, "packaging/smoke_bundle.py", str(exe), bundle_id], check=True)
      - name: Zip macOS and Linux builds (keeps the executable bit)
        if: runner.os != 'Windows'
        run: cd dist && for f in g6-*; do zip -9 "$f.zip" "$f" && rm "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Prepare a new draft release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "refusing to replace an existing release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --draft --verify-tag --notes "Draft bundles. Publish only after the release gates and checksums are reviewed."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
