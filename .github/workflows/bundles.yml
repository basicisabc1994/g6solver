# Builds the bundle executables on Windows, macOS and Linux. On a version tag (v*) they are
# attached to a GitHub Release, which is where the website's download buttons point.
name: bundles
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . "pyinstaller==6.16.0"
      - run: python packaging/build_bundles.py
      - name: Smoke-test every executable offline
        shell: python
        run: |
          import pathlib, subprocess, sys
          for exe in sorted(pathlib.Path("dist").iterdir()):
              bundle_id = exe.stem.removeprefix("g6-").rsplit("-", 2)[0]
              subprocess.run([sys.executable, "packaging/smoke_bundle.py", str(exe), bundle_id], check=True)
      - name: Zip macOS and Linux builds (keeps the executable bit)
        if: runner.os != 'Windows'
        run: cd dist && for f in g6-*; do zip -9 "$f.zip" "$f" && rm "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
                 --notes "Bundles for Windows, macOS and Linux. See the install guide on the website."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
