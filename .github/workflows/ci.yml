# Tests on every push and pull request (free GitHub-hosted runners for public repos).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history: tests/conformance checks each certificate against the commits that first held its inputs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # README's contributor install (dev,all), editable: the tests read the source tree, and a certificate is checked
      # against the git history of the files G6 is imported from, which an installed copy has none of. With it the
      # docs extra (pypdf), so the PDF converter's tests run, and the rq extra and fakeredis (BSD-3-Clause, an
      # in-memory Redis stand-in), so tests/integrations/test_adapt_rq.py runs instead of skipping; fakeredis is here,
      # not in the dev extra, whose dependency closure is generated online.
      - run: python -m pip install -e ".[dev,all,rq,docs]" "fakeredis>=2,<3"
      # Bubblewrap, G6's operating-system boundary on Linux, with the AppArmor profile Ubuntu's runners need; with
      # G6_EXPECT_BACKEND=bubblewrap the bwrap tests fail rather than skip when it cannot confine a run.
      - if: runner.os == 'Linux'
        run: bash tools/ci_bubblewrap.sh
      # macOS has no operating-system boundary, and the Windows runner's interpreter is not granted to the
      # AppContainer, so G6 would refuse every run of untrusted code there: these jobs take the person's opt-in. They
      # prove the refusal logic (its tests clear the variable) and the opt-in path, never a boundary; Linux's job, with
      # bubblewrap and no opt-in, is the boundary's evidence.
      - if: runner.os != 'Linux'
        shell: bash
        run: echo "G6_ALLOW_UNCONFINED=1" >> "$GITHUB_ENV"
      # SWI-Prolog on one job, so tests/prolog runs its swipl tests instead of skipping them (swipl is then on PATH).
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      # The suite runs in groups, never as one process (tools/suite_split.ps1; pwsh is on every hosted runner).
      - name: Test suite, in groups
        run: pwsh -NoProfile -File tools/suite_split.ps1 -Python python -Log suite-split.log
      - name: Group summaries
        if: always()
        shell: pwsh
        run: if (Test-Path suite-split.log) { Get-Content suite-split.log }
      # Each group's whole output, tracebacks included, when a group failed: the summaries name the tests, not why.
      - name: Group outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.os }}-${{ matrix.python }}
          path: suite-split.log*
          retention-days: 14
      - run: ruff check src tests
      - run: lint-imports
      - run: g6 doctor
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The extras the kit's D9 check blocks one at a time, so each is present to be taken away (editable, as above),
      # and the certified components' own (ml, automl, bayes), so each certificate is reissued and compared here: the
      # test job skips a certificate, and a skill example, where an extra its component declares is not installed.
      - run: python -m pip install -e ".[dev,all,ml,automl,bayes]"
      # Bubblewrap, as on the test job: the fits and the skills' examples run their scripts inside it.
      - run: bash tools/ci_bubblewrap.sh
      # And every skill's Python examples, which the test job skips where an extra they use is not installed.
      - name: Extension conformance kit
        run: python -m pytest -q tests/conformance tests/core/test_component_skills.py
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Secret / licence / private-data scan
        run: python tools/export_public.py --scan . --public-ci
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "mkdocs-material==9.5.39"
      - run: mkdocs build --strict -f site/mkdocs.yml
      # The Django site in web/ (pyproject's site extra: django>=5.1,<6, markdown>=3.5), so tests/site runs, not skips;
      # the other extras are the test job's, which the site's pages read from.
      - run: python -m pip install -e ".[dev,mcp,abstraction,site]"
      - name: Site tests
        run: python -m pytest -q tests/site
