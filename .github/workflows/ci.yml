# Tests on every push and pull request (free GitHub-hosted runners for public repos).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
        # The suite in four jobs per OS and Python: as one job it ran 5 h on Linux and passed the hosted runner's 6 h
        # limit on Windows, which cancelled it. Each job runs every group but only its shard's test files (the split
        # script's -Shard and the tests/g6_shard.py plugin), so each file runs in exactly one job.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history: tests/conformance checks each certificate against the commits that first held its inputs.
      - uses: actions/checkout@v4
        with:
          # Certificates bind the reviewed first-parent history; land this stack by fast-forward.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # README's contributor install (dev,all), editable: the tests read the source tree, and a certificate is checked
      # against the git history of the files G6 is imported from, which an installed copy has none of. With it the
      # docs extra (pypdf), so the PDF converter's tests run, and the rq extra and fakeredis (BSD-3-Clause, an
      # in-memory Redis stand-in), so tests/integrations/test_adapt_rq.py runs instead of skipping; fakeredis is here,
      # not in the dev extra, whose dependency closure is generated online.
      - run: python -m pip install -e ".[dev,all,rq,docs]" "fakeredis>=2,<3"
      # Bubblewrap, G6's operating-system boundary on Linux, with the AppArmor profile Ubuntu's runners need; with
      # G6_EXPECT_BACKEND=bubblewrap the bwrap tests fail rather than skip when it cannot confine a run.
      - if: runner.os == 'Linux'
        run: bash tools/ci_bubblewrap.sh
      # macOS has no operating-system boundary, and the Windows runner's interpreter is not granted to the
      # AppContainer, so G6 would refuse every run of untrusted code there: these jobs take the person's opt-in. They
      # prove the refusal logic (its tests clear the variable) and the opt-in path, never a boundary; Linux's job, with
      # bubblewrap and no opt-in, is the boundary's evidence.
      - if: runner.os != 'Linux'
        shell: bash
        run: echo "G6_ALLOW_UNCONFINED=1" >> "$GITHUB_ENV"
      # macOS's temporary folder is under /var, a link to /private/var, and G6 refuses a state or input path with a
      # linked part, by design. The tests get its real path, so tmp_path and each G6_HOME made under it hold no link.
      - if: runner.os == 'macOS'
        shell: bash
        run: echo "TMPDIR=$(cd "${TMPDIR:-/tmp}" && pwd -P)/" >> "$GITHUB_ENV"
      # SWI-Prolog on one job, so tests/prolog runs its swipl tests instead of skipping them (swipl is then on PATH).
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      # The suite runs in groups, never as one process (tools/suite_split.ps1; pwsh is on every hosted runner).
      - name: Test suite, in groups
        run: pwsh -NoProfile -File tools/suite_split.ps1 -Python python -Log suite-split.log -Shard "${{ matrix.shard }}/4"
      - name: Group summaries
        if: always()
        shell: pwsh
        run: if (Test-Path suite-split.log) { Get-Content suite-split.log }
      # Each group's whole output, tracebacks included, when a group failed: the summaries name the tests, not why.
      - name: Group outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard }}
          path: suite-split.log*
          retention-days: 14
      - if: matrix.shard == 1
        run: ruff check src tests
      - if: matrix.shard == 1
        run: lint-imports
      - run: g6 doctor
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The extras the kit's D9 check blocks one at a time, so each is present to be taken away (editable, as above),
      # and the certified components' own (ml, automl, bayes), so each certificate is reissued and compared here: the
      # test job skips a certificate, and a skill example, where an extra its component declares is not installed.
      - run: python -m pip install -e ".[dev,all,ml,automl,bayes]"
      # Bubblewrap, as on the test job: the fits and the skills' examples run their scripts inside it.
      - run: bash tools/ci_bubblewrap.sh
      # And every skill's Python examples, which the test job skips where an extra they use is not installed.
      - name: Extension conformance kit
        run: python -m pytest -q tests/conformance tests/core/test_component_skills.py
  # The outside review's gate 5: every operation P1 added, over a real stdio MCP server started from an installed wheel
  # (not editable), so `import g6` comes from site-packages. MCP and pytest, no key, no model call. It checks no
  # certificate, so it needs neither the reviewed head's ref nor the whole history.
  mcp-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel into a clean environment
        shell: pwsh
        run: |
          python -m venv --copies "$env:RUNNER_TEMP/g6-smoke-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokePython = if ($IsWindows) { "$env:RUNNER_TEMP/g6-smoke-venv/Scripts/python.exe" } else { "$env:RUNNER_TEMP/g6-smoke-venv/bin/python" }
          $wheel = (Get-ChildItem -LiteralPath dist -Filter '*.whl').FullName
          & $smokePython -m pip install "$($wheel)[mcp]" pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "G6_SMOKE_PYTHON=$smokePython" >> $env:GITHUB_ENV
      - if: runner.os == 'Linux'
        run: bash tools/ci_bubblewrap.sh
      # The ephemeral runner grants its Python and new venv read/execute only, never the source checkout or state.
      - name: Prepare Windows AppContainer reads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($folder in @($env:pythonLocation, "$env:RUNNER_TEMP/g6-smoke-venv")) {
            icacls $folder /grant '*S-1-15-2-1:(OI)(CI)(RX)'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            icacls "$folder/*" /grant '*S-1-15-2-1:(RX)' /T /C /Q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Installed MCP handshake, consent and confined patch review
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          G6_DISABLE_LLM: "1"
          G6_REQUIRE_ISOLATION: "1"
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & $env:G6_SMOKE_PYTHON -I -c "from pathlib import Path; import g6, sys; assert Path(g6.__file__).is_relative_to(sys.prefix), g6.__file__"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:G6_SMOKE_PYTHON "$env:GITHUB_WORKSPACE/tools/mcp_smoke.py" --patch-review
          exit $LASTEXITCODE
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Secret / licence / private-data scan
        run: python tools/export_public.py --scan . --public-ci
  site:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the copy check's control tests (tests/site/copyfur1, copyfur2) read the check as it was at
      # an earlier commit (git show <commit>:tests/site/test_honesty.py), which a one-commit checkout does not hold.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "mkdocs-material==9.5.39"
      - run: mkdocs build --strict -f site/mkdocs.yml
      # The Django site in web/ (pyproject's site extra: django>=5.1,<6, markdown>=3.5), so tests/site runs, not skips;
      # the other extras are the test job's, which the site's pages read from.
      - run: python -m pip install -e ".[dev,mcp,abstraction,site]"
      - name: Site tests
        run: python -m pytest -q tests/site
